name: Terraform Deployment Pipeline
on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

# env:
#     AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
#     AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }} 
#     AWS_REGION: eu-west-2

jobs:
  terraform-plan:
    runs-on: ubuntu-latest
 
    steps:
      #Fetch code from the repository onot runner
      - name: Checkout code 
        uses: actions/checkout@v4

      #Setup version of terraform to use in the pipeline
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.5"

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: arn:aws:iam::454437765757:role/GitHubTerraformDeployRole
          aws-region: eu-west-2

      - name: Verify AWS Identity
        run: aws sts get-caller-identity
      
      #Connect to remote backend to store terraform state file
      - name: Terraform Init
        run: terraform init

      # Check Terraform formatting
      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      # Validate Terraform configuration
      - name: Terraform Validate
        run: terraform validate

      # Install TFLint
      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v6
        with:
          tflint_version: latest

      # Run TFLint
      - name: Initialise TFLint
        run: tflint --init

      - name: Terraform Lint
        run: tflint --recursive

      # Terraform security scanning
      - name: Checkov Security Scan
        uses: bridgecrewio/checkov-action@master
        with:
          directory: .
          framework: terraform
          soft_fail: false

      #Terraform Plan to check for any changes in the infrastructure
      - name: Terraform Plan
        run: terraform plan -out=tfplan

      # Upload the plan for the Apply job
      - name: Upload Terraform Plan
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan
          path: tfplan
          if-no-files-found: error
          retention-days: 1

  terraform-apply:
    name: deploy-to-production
    needs: terraform-plan #prevent apply until plan is successful
    runs-on: ubuntu-latest

    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.5"

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: arn:aws:iam::454437765757:role/GitHubTerraformDeployRole
          aws-region: eu-west-2

      - name: Verify AWS Identity
        run: aws sts get-caller-identity    

      - name: Terraform Init
        run: terraform init

      # Download the plan created in the previous job
      - name: Download Terraform Plan
        uses: actions/download-artifact@v4
        with:
          name: terraform-plan
          path: .

      - name: Terraform Apply
        run: terraform apply -auto-approve